# ============================================================
# 公共反向代理配置（被 nginx.conf 中每个 location 用 include 引入）
# 作用：统一设置转发到后端 smart-server 时的 HTTP 头与超时，
#       避免在每个 location 里重复书写。
# ============================================================

# 与上游通信使用 HTTP/1.1：默认是 1.0（无长连接），1.1 才支持 keepalive，减少握手开销。
proxy_http_version 1.1;

# 保留客户端请求的 Host 头，后端按域名/端口路由时不丢失原始主机信息。
proxy_set_header Host $host;

# 传给后端的客户端真实 IP（nginx 与后端在同一台机器时两者通常相同）。
proxy_set_header X-Real-IP $remote_addr;

# 记录完整转发链（客户端 IP 追加到已有链末尾），供后端日志审计使用。
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

# 告诉后端客户端使用的是 http 还是 https。
proxy_set_header X-Forwarded-Proto $scheme;

# 透传 JWT 相关请求头到后端，smart-server 的拦截器读取并校验身份：
# Authorization 为兼容的 Bearer 写法；authentication / token 为项目约定的用户/管理员令牌头。
proxy_set_header Authorization $http_authorization;
proxy_set_header authentication $http_authentication;
proxy_set_header token $http_token;

# 清空客户端 Connection 头，避免"hop-by-hop"头干扰上游 keepalive 复用。
proxy_set_header Connection "";

# 与后端建立连接的超时（秒）：后端不可达时快速失败，不长期占用连接。
proxy_connect_timeout 5s;
# 向后端发送数据的超时（秒）。
proxy_send_timeout 30s;
# 等待后端响应的超时（秒）。
proxy_read_timeout 30s;
