# ============================================================
# Flash-Bite 本机原生 Nginx 主配置
# 作用：反向代理（客户端 -> Nginx:80 -> smart-server:8080）与基础限流。
# 使用前先阅读同目录 README.md：将本文件与 proxy-common.conf 复制到
# Nginx 安装目录的 conf/ 下，再执行 nginx.exe -t 校验、启动。
# ============================================================

# 工作进程数：单机开发环境 1 个即可，通常等于 CPU 核数。
worker_processes 1;

# 错误日志级别与输出文件（相对 Nginx 安装目录）。
error_log logs/error.log warn;
# 进程号文件（Nginx 用它管理主进程）。
pid logs/nginx.pid;

# events 块：配置事件模型与每个工作进程的最大连接数。
events {
    worker_connections 1024;   # 单个 worker 最多同时 1024 个连接
}

# http 块：所有 HTTP 服务器配置的顶层容器。
http {
    include mime.types;                    # 引入文件类型与扩展名映射（静态资源 Content-Type）
    default_type application/octet-stream; # 未匹配到映射时的默认类型

    # 访问日志格式：记录客户端 IP、时间、请求、状态码、来源与 UA 等。
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log logs/access.log main;       # 访问日志写入 logs/access.log

    sendfile on;               # 开启 sendfile，减少内核与用户态复制，提高静态文件发送效率
    keepalive_timeout 65;      # 客户端长连接超时（秒）

    # ---- 限流区域定义（仅定义，具体使用在下方 location 中）----
    # 按客户端 IP 划分连接数区域：单 IP 最多 20 个并发连接。
    limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;
    # 按客户端 IP 划分请求速率区域（10m 为共享内存大小）。
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;            # 登录：每分钟 5 个
    limit_req_zone $binary_remote_addr zone=coupon_claim_limit:10m rate=10r/s;    # 领券：每秒 10 个
    limit_req_zone $binary_remote_addr zone=order_submit_limit:10m rate=5r/s;     # 下单：每秒 5 个

    # server 块：一个虚拟主机，监听 80 端口。
    server {
        listen 80;                      # 监听 80 端口（HTTP 默认端口，URL 可不带端口）
        server_name localhost 127.0.0.1;

        client_max_body_size 10m;       # 允许上传的请求体最大 10MB（如购物车/订单 JSON）
        limit_conn per_ip_conn 20;      # 整个 server 生效：单 IP 并发连接上限 20
        limit_conn_status 429;          # 连接超限时返回 HTTP 429
        limit_req_status 429;           # 请求速率超限时返回 HTTP 429

        # JWT 鉴权和跨域响应由 smart-server 统一处理，Nginx 只负责转发与基础限流。

        # 登录接口：独立限流（5 请求/分钟，突发 5），防止被暴力刷取。
        location = /user/user/login {
            limit_req zone=login_limit burst=5 nodelay;
            include proxy-common.conf;            # 引入公共反向代理头设置
            proxy_pass http://127.0.0.1:8080;     # 转发到后端 smart-server
        }

        # 领取优惠券接口：独立限流（10 请求/秒，突发 20），降低瞬时冲击。
        # 身份校验由服务端 JWT 完成，Nginx 仅做入口限流。
        location = /user/coupon/seckill {
            limit_req zone=coupon_claim_limit burst=20 nodelay;
            include proxy-common.conf;
            proxy_pass http://127.0.0.1:8080;
        }

        # 下单接口：独立限流（5 请求/秒，突发 10），降低瞬时冲击。
        # 身份校验由服务端 JWT 完成，Nginx 仅做入口限流。
        location = /user/order/submit {
            limit_req zone=order_submit_limit burst=10 nodelay;
            include proxy-common.conf;
            proxy_pass http://127.0.0.1:8080;
        }

        # 兜底 location：除上面三个精确路径外的所有请求都走这里，
        # 只做转发，不限流（仅受全局 limit_conn 20 并发连接约束）。
        location / {
            include proxy-common.conf;
            proxy_pass http://127.0.0.1:8080;
        }
    }
}
